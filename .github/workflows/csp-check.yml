name: csp-check

on:
  pull_request:
    paths:
      - client/**
      - .github/workflows/csp-check.yml

jobs:
  csp-check:
    name: CSP hashes match build output
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run prod:build

      # Fails if netlify.toml's script-src hashes don't match the built index.html
      # (e.g. an Angular bump changed the Beasties loader). Fix with `make build` and commit netlify.toml.
      - name: Check CSP hashes
        run: node scripts/update-csp-hash.js --check
